<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="track-booking-title">
  <title id="track-booking-title">Track booking platform architecture: five white-label venue frontends over one Next.js and Django booking API, connected to Stripe and PostgreSQL.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c93ff" />
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#0c1220" />

  <!-- Venue row -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="20" fill="#c9d3ef">
    <g>
      <rect x="80" y="90" width="264" height="90" rx="14" fill="#151d33" stroke="#2c3a63" />
      <text x="212" y="128" text-anchor="middle">Coastal</text>
      <text x="212" y="154" text-anchor="middle">Raceway</text>
    </g>
    <g>
      <rect x="376" y="90" width="264" height="90" rx="14" fill="#151d33" stroke="#2c3a63" />
      <text x="508" y="128" text-anchor="middle">Ridgeline</text>
      <text x="508" y="154" text-anchor="middle">Motor Club</text>
    </g>
    <g>
      <rect x="672" y="90" width="256" height="90" rx="14" fill="#151d33" stroke="#2c3a63" />
      <text x="800" y="128" text-anchor="middle">The Motor</text>
      <text x="800" y="154" text-anchor="middle">Harbor</text>
    </g>
    <g>
      <rect x="960" y="90" width="264" height="90" rx="14" fill="#151d33" stroke="#2c3a63" />
      <text x="1092" y="128" text-anchor="middle">Summit</text>
    </g>
    <g>
      <rect x="1256" y="90" width="264" height="90" rx="14" fill="#151d33" stroke="#2c3a63" />
      <text x="1388" y="128" text-anchor="middle">Spring</text>
      <text x="1388" y="154" text-anchor="middle">Mountain</text>
    </g>
  </g>

  <!-- Converging lines to frontend -->
  <g stroke="#3a4a7a" stroke-width="2" fill="none">
    <path d="M212,180 C212,260 700,260 800,320" />
    <path d="M508,180 C508,250 700,270 800,320" />
    <path d="M800,180 L800,320" />
    <path d="M1092,180 C1092,250 900,270 800,320" />
    <path d="M1388,180 C1388,260 900,260 800,320" />
  </g>

  <!-- Frontend layer -->
  <rect x="500" y="330" width="600" height="110" rx="16" fill="#182142" stroke="#405189" stroke-width="2" />
  <text x="800" y="378" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#e7ecff">White-label frontend</text>
  <text x="800" y="410" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#8b9bd6">React + Next.js + TypeScript</text>

  <line x1="800" y1="440" x2="800" y2="530" stroke="#7c93ff" stroke-width="3" marker-end="url(#arrow)" />

  <!-- API layer -->
  <rect x="500" y="540" width="600" height="110" rx="16" fill="#182142" stroke="#405189" stroke-width="2" />
  <text x="800" y="588" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#e7ecff">Booking &amp; ops API</text>
  <text x="800" y="620" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#8b9bd6">Django &#183; reservations, CRM, fleet, events</text>

  <line x1="800" y1="650" x2="800" y2="740" stroke="#7c93ff" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="1100" y1="595" x2="1290" y2="595" stroke="#7c93ff" stroke-width="3" marker-end="url(#arrow)" />

  <!-- Data layer -->
  <rect x="560" y="750" width="480" height="100" rx="16" fill="#101733" stroke="#2c3a63" stroke-width="2" />
  <text x="800" y="792" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#c9d3ef">PostgreSQL</text>
  <text x="800" y="820" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#7484b3">reservations &#183; CRM &#183; reporting</text>

  <!-- Stripe -->
  <rect x="1300" y="545" width="220" height="100" rx="16" fill="#101733" stroke="#2c3a63" stroke-width="2" />
  <text x="1410" y="587" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#c9d3ef">Stripe</text>
  <text x="1410" y="615" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#7484b3">cards &#183; gift certs &#183; promos</text>
</svg>
