<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="task-manager-title">
  <title id="task-manager-title">Task Manager architecture: an Express API handling JWT authentication and task endpoints, backed by MongoDB, with SendGrid for email verification.</title>
  <defs>
    <marker id="arrow-tm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c93ff" />
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#0c1220" />

  <!-- Client -->
  <rect x="660" y="90" width="280" height="90" rx="14" fill="#151d33" stroke="#2c3a63" stroke-width="2" />
  <text x="800" y="132" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#c9d3ef">Client</text>
  <text x="800" y="156" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#7484b3">any task-management UI</text>

  <line x1="800" y1="180" x2="800" y2="260" stroke="#7c93ff" stroke-width="3" marker-end="url(#arrow-tm)" />

  <!-- Express API -->
  <rect x="500" y="270" width="600" height="150" rx="16" fill="#182142" stroke="#405189" stroke-width="2" />
  <text x="800" y="315" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#e7ecff">Express.js API</text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#8b9bd6">
    <rect x="530" y="335" width="260" height="60" rx="10" fill="#101733" stroke="#2c3a63" />
    <text x="660" y="371" text-anchor="middle">JWT authentication</text>

    <rect x="810" y="335" width="260" height="60" rx="10" fill="#101733" stroke="#2c3a63" />
    <text x="940" y="371" text-anchor="middle">Task CRUD endpoints</text>
  </g>

  <line x1="660" y1="420" x2="620" y2="540" stroke="#7c93ff" stroke-width="2.5" marker-end="url(#arrow-tm)" />
  <line x1="940" y1="420" x2="980" y2="540" stroke="#7c93ff" stroke-width="2.5" marker-end="url(#arrow-tm)" />

  <!-- MongoDB -->
  <rect x="440" y="550" width="360" height="110" rx="16" fill="#101733" stroke="#2c3a63" stroke-width="2" />
  <text x="620" y="596" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#c9d3ef">MongoDB</text>
  <text x="620" y="624" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#7484b3">users &#183; tasks</text>

  <!-- SendGrid -->
  <rect x="800" y="550" width="360" height="110" rx="16" fill="#101733" stroke="#2c3a63" stroke-width="2" />
  <text x="980" y="596" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#c9d3ef">SendGrid</text>
  <text x="980" y="624" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#7484b3">email verification &#183; notifications</text>
</svg>
