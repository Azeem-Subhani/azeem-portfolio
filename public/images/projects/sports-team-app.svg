<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="sports-team-title">
  <title id="sports-team-title">Sports team app architecture: Angular and Ionic clients over a NestJS API, branching to Firestore real-time messaging, Stripe Connect payments, and a RAG email pipeline.</title>
  <defs>
    <marker id="arrow-sports-team" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c93ff" />
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#0c1220" />

  <!-- Clients -->
  <rect x="500" y="80" width="280" height="100" rx="16" fill="#151d33" stroke="#2c3a63" stroke-width="2" />
  <text x="640" y="122" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#c9d3ef">Web client</text>
  <text x="640" y="150" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#7484b3">Angular</text>

  <rect x="820" y="80" width="280" height="100" rx="16" fill="#151d33" stroke="#2c3a63" stroke-width="2" />
  <text x="960" y="122" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#c9d3ef">Mobile client</text>
  <text x="960" y="150" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#7484b3">Ionic</text>

  <line x1="640" y1="180" x2="750" y2="260" stroke="#7c93ff" stroke-width="3" marker-end="url(#arrow-sports-team)" />
  <line x1="960" y1="180" x2="850" y2="260" stroke="#7c93ff" stroke-width="3" marker-end="url(#arrow-sports-team)" />

  <!-- NestJS API -->
  <rect x="550" y="270" width="500" height="110" rx="16" fill="#182142" stroke="#405189" stroke-width="2" />
  <text x="800" y="318" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#e7ecff">NestJS API</text>
  <text x="800" y="350" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#8b9bd6">teams &#183; scheduling &#183; wallets</text>

  <!-- Branches -->
  <path d="M650,380 C650,460 350,460 350,540" stroke="#7c93ff" stroke-width="2.5" fill="none" marker-end="url(#arrow-sports-team)" />
  <path d="M800,380 L800,540" stroke="#7c93ff" stroke-width="2.5" fill="none" marker-end="url(#arrow-sports-team)" />
  <path d="M950,380 C950,460 1250,460 1250,540" stroke="#7c93ff" stroke-width="2.5" fill="none" marker-end="url(#arrow-sports-team)" />

  <!-- Firestore -->
  <rect x="180" y="550" width="340" height="120" rx="16" fill="#101733" stroke="#2c3a63" stroke-width="2" />
  <text x="350" y="596" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#c9d3ef">Firestore</text>
  <text x="350" y="622" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#7484b3">real-time messaging</text>
  <text x="350" y="644" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#7484b3">Socket.IO live updates</text>

  <!-- Stripe Connect -->
  <rect x="630" y="550" width="340" height="120" rx="16" fill="#101733" stroke="#2c3a63" stroke-width="2" />
  <text x="800" y="596" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#c9d3ef">Stripe Connect</text>
  <text x="800" y="622" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#7484b3">in-app invoicing</text>
  <text x="800" y="644" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#7484b3">player-to-player payments</text>

  <!-- RAG pipeline -->
  <rect x="1080" y="550" width="340" height="120" rx="16" fill="#101733" stroke="#2c3a63" stroke-width="2" />
  <text x="1250" y="596" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#c9d3ef">RAG email pipeline</text>
  <text x="1250" y="622" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#7484b3">retrieves team context</text>
  <text x="1250" y="644" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#7484b3">pre/post-game emails</text>

  <line x1="350" y1="670" x2="350" y2="760" stroke="#4a5a90" stroke-width="2" marker-end="url(#arrow-sports-team)" />
  <text x="350" y="800" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#5b6cad">Teams &#183; coaches &#183; players</text>
</svg>
